# /etc/proxy-manager/tproxy.conf
#
# Single source of truth for the TPROXY firewall. Both apply.sh and remove.sh
# source this file, so `remove.sh` tears down exactly what `apply.sh` created.
# The Go backend passes CONF_FILE to scripts/tproxy/apply.sh.
#
# SYNTAX: one KEY="value" per line. This file is sourced by bash AND parsed
# for {{VAR}} substitution into tproxy.nft.template -- do not put inline
# comments after a value.

# --- Interfaces -------------------------------------------------------------

# LAN interface on the Pi: the one facing the OpenWrt box / your clients.
LAN_IF="eth0"

# --- Sing-box TPROXY inbound ------------------------------------------------

# Must match the "listen_port" of the tproxy inbound in sing-box.json.
TPROXY_PORT="7892"

# 0x1 is deliberate. Docker's own MASQUERADE/ACCEPT chains never assign marks,
# so a non-zero mark here is unambiguous proof that WE intercepted the packet.
# Must match the fwmark sing-box uses for its own TPROXY socket option.
TPROXY_FWMARK="0x1"

# Policy-routing table that receives: ip rule add fwmark 0x1 lookup 100,
# ip route add local default dev lo table 100. This is what makes TPROXY
# delivery work (the kernel needs a local route for the original destination).
TPROXY_TABLE="100"

# --- Addresses --------------------------------------------------------------

# Pi's LAN address. Used to compute the lan_cidrs bypass set fallback when
# LAN_IF has no global address at boot (rare, but fails closed otherwise).
PI_LAN_IP="192.168.3.5"

# --- Routing policy ---------------------------------------------------------

# Source prefixes never intercepted, even when their destination looks
# routable to WAN. Use this as the escape hatch when you later route the Pi's
# OWN traffic through sing-box (TUN mode or policy-routing): put the Pi's
# outbound address(es) here so the control plane never deadlocks.
# Space separated, CIDR or single address. Empty = no extra bypass.
SELF_ORIGIN_NETS=""

# Set to "no" to skip zeroing rp_filter on wg* interfaces. Only relevant if
# you run kernel-mode WireGuard on the Pi itself; wg-easy inside Docker is
# unaffected.
WG_RP_FILTER="yes"
