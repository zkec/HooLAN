<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Light background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    
    <!-- Dark Red accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle -->
  <rect width="400" height="400" rx="90" fill="url(#bg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Left Pillar (The Client) -->
  <rect x="124" y="135" width="32" height="130" rx="16" fill="#0f172a" />

  <!-- Right Pillar (The Internet) -->
  <rect x="244" y="135" width="32" height="130" rx="16" fill="#0f172a" />

  <!-- The Routing Detour (The Crossbar) -->
  <path d="M 140 220 C 195 220, 195 170, 260 170" 
        fill="none" 
        stroke="url(#accent)" 
        stroke-width="26" 
        stroke-linecap="round" />

  <!-- The Data Packet -->
  <circle cx="260" cy="170" r="14" fill="#ffffff" />
  <circle cx="260" cy="170" r="6" fill="#ef4444" />
</svg>
