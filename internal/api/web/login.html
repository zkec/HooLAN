<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="referrer" content="no-referrer" />
  <title>Sign in · Proxy Manager</title>
  <script src="/preferences.js"></script>
  <script src="/i18n.js" defer></script>
  <link rel="stylesheet" href="/style.css" />
  <script src="/login.js" defer></script>
</head>
<body class="login-body">
  <main class="login-main">
    <a class="brand login-brand" href="/"><span class="brand-icon" aria-hidden="true">P</span><span>Proxy Manager<small>SMART GATEWAY</small></span></a>
    <section class="card login-card" aria-labelledby="login-heading">
      <p class="eyebrow">GATEWAY ACCESS</p><h1 id="login-heading">Welcome back.</h1><p class="muted">Sign in to manage your network.</p>
      <noscript><p class="notice">JavaScript is required to sign in.</p></noscript>
      <form id="login-form">
        <div class="field"><label for="login-token">Access token</label><input id="login-token" name="password" type="password" required autocomplete="current-password" spellcheck="false" autocapitalize="none" aria-describedby="token-help" autofocus /><p id="token-help" class="muted small">Use the token configured in PROXY_MANAGER_TOKEN.</p></div>
        <p id="login-error" class="login-error small" role="alert" hidden></p>
        <button id="login-submit" class="button primary" type="submit">Sign in</button>
      </form>
      <p class="login-footnote muted small">Your session stays in an HttpOnly cookie. The access token is never saved in browser storage.</p>
    </section>
    <p class="muted small login-caption">Your gateway. Your connections.</p>
  </main>
</body>
</html>
